name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (release)
        working-directory: port
        run: swift build -c release
      - name: "Unit tests (tests needing the game disk are skipped; no game data in the repository)"
        working-directory: port
        run: swift test
      - name: Reference emulator
        run: make -C tools/amiga
